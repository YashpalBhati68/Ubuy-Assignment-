<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login & Sign Up</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <main class="main-container">
      <!-- *********************************************** -->

      <section class="form-section">
        <!-- Login aur Signup buttons -->
        <div class="forms-button">
          <button type="button" id="login-Form-Button" class="active">
            Login
          </button>

          <button type="button" id="signup-Form-Button">Sign Up</button>
        </div>

        <!--  form -->
        <form id="mainForm" novalidate>
          <input
            id="userEmail"
            type="email"
            required
            placeholder="Enter email address"
          />

          <!-- Login fields -->
          <div id="loginFields">
            <div class="login-options">
              <div class="button-Toggle">
                <button
                  type="button"
                  id="passwordBtn"
                  class="active"
                  onclick="showPassword()"
                >
                  Password
                </button>

                <button type="button" id="otpBtn" onclick="showOTP()">
                  OTP
                </button>
              </div>

              <div class="input-box">
                <div id="login-password-box">
                  <div class="password-box">
                    <input
                      id="login-password"
                      type="password"
                      maxlength="15"
                      placeholder="Enter password"
                      required
                    />

                    <button
                      type="button"
                      class="show-hide-button"
                      data-eye="login-password"
                    >
                      <i class="bi bi-eye-slash"></i>
                    </button>
                  </div>
                </div>

                <div id="login-otp-box" class="hidden">
                  <input
                    id="loginOtp"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="Enter OTP"
                  />
                </div>
              </div>
            </div>

            <button type="button" id="forgot-password" class="link">
              Forgot Your Password?
            </button>
          </div>

          <!-- Signup fields -->
          <div id="signupFields" class="hidden">
            <div class="signup-options">
              <div class="button-Toggle">
                <button
                  type="button"
                  id="signupOtpBtn"
                  class="active"
                  onclick="showSignupOTP()"
                >
                  OTP
                </button>

                <button
                  type="button"
                  id="signupPasswordBtn"
                  onclick="showSignupPassword()"
                >
                  Password
                </button>
              </div>

              <div class="input-box">
                <div id="signup-otp-button">
                  <input
                    id="signup-otp"
                    inputmode="numeric"
                    placeholder="Enter OTP"
                  />
                </div>

                <div id="signup-password-box" class="hidden">
                  <div class="password-field">
                    <input
                      id="signupPassword"
                      type="password"
                      required
                      maxlength="15"
                      placeholder="enter password"
                    />

                    <button
                      type="button"
                      class="show-hide-button"
                      data-eye="signupPassword"
                    >
                      <i class="bi bi-eye-slash"></i>
                    </button>
                  </div>

                  <div class="strength-track">
                    <div id="strengthBar"></div>
                  </div>

                  <small id="strengthText">Password strength</small>
                </div>
              </div>
            </div>

            <button type="button" id="getOtp" class="link">Get OTP?</button>

            <label class="check-row">
              <input id="mailingList" type="checkbox" />
              <span
                >Join Our Mailing List- Get updates on Rollbacks, special
                pricing, hot new items, gift ideas and more.</span
              >
            </label>

            <label class="check-row robot">
              <input id="recaptcha" type="checkbox" />
              <span>I'm not a robot</span>
            </label>
          </div>

          <!-- Messages dono modes ke liye -->
          <p id="formError" class="error" aria-live="polite"></p>
          <p id="formMessage" class="message" aria-live="polite"></p>

          <button class="primary" id="submitButton" type="submit">Login</button>

          <div class="condition-toggle-section">
            <p class="terms">
              By continuing, you agree to Ubuy's
              <a href="https://www.ubuy.co.in/" target="_blank">
                Terms and Conditions </a
              >.
            </p>

            <div class="form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="themeToggle"
              />
            </div>
          </div>
        </form>
      </section>

      <!--***********************************************  -->

      <!-- social media icons -->
      <div class="social">
        <button type="button" class="social-btn">
          <i class="fa-brands fa-google"></i>
        </button>
        <button type="button" class="social-btn">
          <i class="fa-brands fa-facebook-f"></i>
        </button>
        <button type="button" class="social-btn">
          <i class="fa-brands fa-apple"></i>
        </button>
        <button type="button" class="social-btn">
          <i class="fa-brands fa-paypal"></i>
        </button>
        <span>Login with Social Accounts</span>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
